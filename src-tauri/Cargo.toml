[package]
name = "bifrossh"
version = "0.17.0"
description = "GUI SSH client with built-in SFTP and keychain management"
authors = ["Aalman Sadath"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AalmanSadath/BifroSSH"
edition = "2021"

[lib]
name = "bifrossh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ring rather than the default aws-lc-rs, which needs cmake and NASM to
# build: the Flatpak builds offline with the SDK's tools, and Windows would
# need NASM installed.
russh = { version = "0.63", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2"
tokio = { version = "1", features = ["full"] }
# Unpacking a tar stream from the server: a compressed download is one
# stream rather than an SFTP round trip per file. os_pipe feeds the two,
# which are blocking, from the async side.
tar = "0.4"
flate2 = "1"
os_pipe = "1"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
# Wipes a sudo password held for the Containers panel when it is let go.
# Already in the tree by way of the crypto crates.
zeroize = "1"
anyhow = "1"
dirs = "5"
async-trait = "0.1"
# The version russh pins, so a key read here is the type russh signs with.
ssh-key = { version = "=0.7.0-rc.11", features = ["alloc", "ed25519", "p256", "rsa", "dsa", "getrandom", "encryption"] }
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
argon2 = "0.5"
portable-pty = "0.9.0"
shell-words = "1.1.1"

[target.'cfg(unix)'.dependencies]
# getpwuid_r and friends, for the owner column of a local listing. Already
# in the tree several times over.
libc = "0.2"

# The keyring, the appearance portal and logind are all on the session bus,
# which Android does not have.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

# DPAPI for the wrapping key, the registry for the system theme and accent,
# DirectWrite for the font list, the power, session and address change
# notifications, and the shell's jump list. Pinned to the version the Tauri graph
# already resolves, so this adds no second copy of the crate.
[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree by way of tao, so this is a name for something the app
# links either way rather than a new dependency. Reading the clipboard needs
# the toolkit's own answer: see src/clipboard/mod.rs.
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_Graphics_DirectWrite",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# Pageant, as a second place to find an agent. The version russh already
# depends on, so this names a crate the build has rather than adding one.
pageant = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
# Pausable clock, so a test for a sixty second stall does not take sixty
# seconds. Not in tokio's "full", and wanted only by tests.
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
opt-level = 1
codegen-units = 1

# One codegen unit and link-time optimisation across every crate: a smaller
# and slightly faster binary, on Android (where the library is most of the
# APK) and on the desktop alike, for a slower release link.
[profile.release]
lto = true
codegen-units = 1

