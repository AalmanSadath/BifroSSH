name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so a tag cannot publish something these
  # checks would have rejected. Nothing in here is release specific; it is the
  # same run, reached from a different door.
  workflow_call:

# A newer push makes an in-flight run redundant. Called from the release
# workflow this still keys on the caller's ref, which for a tag is
# refs/tags/vX.Y.Z, so a release and the branch push beside it land in
# different groups and cannot cancel one another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release pushes the commit and its tag together, which GitHub reports as
  # two events for one commit: the branch push lands here, and the tag push
  # lands in the release workflow, which calls this one. Without this the same
  # SHA is built and tested twice, side by side, for no extra information.
  #
  # The branch push is the copy to drop, because the release run is the one
  # whose result actually gates publishing. If the tag is not visible yet when
  # this looks, both runs happen, which is exactly what happened before this
  # job existed: the failure direction is a wasted run, never a skipped check.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: check
        env:
          # Under workflow_call these describe the caller, so a release reads
          # as ref_type=tag and is never the copy that gets dropped.
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tags=$(git tag --points-at HEAD)
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ] && [ -n "$tags" ]; then
            echo "Commit is tagged ($(echo "$tags" | tr '\n' ' ')); the release run covers it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  vendored:
    name: Vendored sources
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Flatpak build runs with no network, so a dependency added since the
      # vendor manifests were last generated fails deep inside the sandbox with
      # an npm ENOTCACHED or a cargo offline error, several minutes in and
      # naming only the first package it happened to want. It is checked here
      # rather than in the release workflow so the push that introduced it
      # fails, instead of the tag weeks later.
      - name: Check vendored sources cover the lockfiles
        run: |
          python3 - <<'PY'
          import json, re, sys

          stale = []

          # Matched on the exact tarball URL the lockfile resolved to, so a
          # dependency that merely changed version is caught as well as one
          # that is absent entirely.
          lock = json.load(open('package-lock.json'))
          node_sources = open('flatpak/node-sources.json').read()
          missing = sorted(
              f"{path.split('node_modules/')[-1]}@{pkg['version']}"
              for path, pkg in lock['packages'].items()
              if path.startswith('node_modules/')
              and pkg.get('resolved', '').endswith('.tgz')
              and pkg['resolved'] not in node_sources
          )
          if missing:
              stale.append(('flatpak/node-sources.json', 'package-lock.json', missing,
                            './flatpak/regen-node-sources.sh'))

          # Every vendored crate gets a "cargo/vendor/<name>-<version>" dest.
          cargo_sources = open('flatpak/cargo-sources.json').read()
          # The crate being built and anything under [patch.crates-io] come from
          # the source tree rather than the registry, so they are never vendored.
          local = set(re.findall(r'^([\w-]+)\s*=\s*\{\s*path\s*=',
                                 open('src-tauri/Cargo.toml').read(), re.M)) | {'bifrossh'}
          missing = sorted(
              f'{name}-{version}'
              for name, version in re.findall(
                  r'\nname = "([^"]+)"\nversion = "([^"]+)"',
                  open('src-tauri/Cargo.lock').read())
              if name not in local
              and f'"cargo/vendor/{name}-{version}"' not in cargo_sources
          )
          if missing:
              stale.append(('flatpak/cargo-sources.json', 'src-tauri/Cargo.lock', missing,
                            'python3 flatpak/flatpak-cargo-generator.py '
                            'src-tauri/Cargo.lock -o flatpak/cargo-sources.json'))

          for sources, lockfile, names, fix in stale:
              print(f'::error::{sources} is missing {len(names)} package(s) '
                    f'present in {lockfile}. Regenerate it with: {fix}')
              for name in names[:20]:
                  print(f'  {name}')
              if len(names) > 20:
                  print(f'  ... and {len(names) - 20} more')

          if stale:
              sys.exit(1)
          print('vendored sources cover both lockfiles')
          PY

  frontend:
    name: Frontend
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs tsc first, so this covers type checking too.
      - name: Type check and build
        run: npm run build

  backend:
    name: Backend
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri needs these to build at all. Kept in step with the Fedora list in
      # the README, which is the other supported build path.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The host key tests compare against ssh-keygen's own output, and the
      # agent tests drive a real ssh-agent, so both binaries must be present.
      - name: Check ssh tooling is available
        run: |
          ssh-keygen --help 2>&1 | head -1 || true
          command -v ssh-agent
          command -v ssh-keygen

      - name: Build
        working-directory: src-tauri
        run: cargo build --lib --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Cargo.lock is committed and the Flatpak build consumes it offline, so a
      # drift here would break packaging rather than just being untidy.
      - name: Cargo.lock is up to date
        run: git diff --exit-code src-tauri/Cargo.lock
