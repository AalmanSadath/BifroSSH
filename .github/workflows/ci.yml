name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow, so a tag cannot publish something these
  # checks would have rejected. Nothing in here is release specific; it is the
  # same run, reached from a different door.
  workflow_call:

# A newer push makes an in-flight run redundant. Called from the release
# workflow this still keys on the caller's ref, which for a tag is
# refs/tags/vX.Y.Z, so a release and the branch push beside it land in
# different groups and cannot cancel one another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` runs tsc first, so this covers type checking too.
      - name: Type check and build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri needs these to build at all. Kept in step with the Fedora list in
      # the README, which is the other supported build path.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The host key tests compare against ssh-keygen's own output, and the
      # agent tests drive a real ssh-agent, so both binaries must be present.
      - name: Check ssh tooling is available
        run: |
          ssh-keygen --help 2>&1 | head -1 || true
          command -v ssh-agent
          command -v ssh-keygen

      - name: Build
        working-directory: src-tauri
        run: cargo build --lib --locked

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Cargo.lock is committed and the Flatpak build consumes it offline, so a
      # drift here would break packaging rather than just being untidy.
      - name: Cargo.lock is up to date
        run: git diff --exit-code src-tauri/Cargo.lock
