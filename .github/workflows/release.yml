name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only one publish at a time, shared with the rollback workflow: each run
# seeds from what the bucket serves and replaces it, so two at once would
# each delete what the other added.
concurrency:
  group: linux-repos
  cancel-in-progress: false

# Only the publish jobs write anything. The builds, and the CI run they depend
# on, get read and nothing more.
permissions:
  contents: read

env:
  APP_ID: io.github.aalmansadath.bifrossh

jobs:
  # The builds below run in a sandbox and never run the test suite, so without
  # this a tag could ship code that CI would have failed. Same checks as an
  # ordinary push, reached from here so that publishing depends on them.
  check:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Its own job because two builds depend on it, and because it costs seconds:
  # a mistake here should not be discovered twenty minutes into a sandboxed
  # Flatpak build or an NSIS package.
  versions:
    name: Versions agree
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check versions agree
        id: check
        # Runs before the expensive steps so a mistake costs seconds, not a full
        # build. AppStream takes the version from the metainfo, not the git tag,
        # so tagging without adding a <release> entry ships an app that updates
        # correctly and then reports the wrong version: a quiet failure that is
        # easy to make and annoying to diagnose.
        run: |
          META="flatpak/${APP_ID}.metainfo.xml"

          # AppStream orders <releases> newest first and every entry here shares
          # the same date, so document order is the only usable signal. Taking
          # the first entry matches how the file is written and maintained.
          meta_ver=$(grep -o '<release version="[^"]*"' "$META" \
            | head -1 | sed -E 's/.*version="([^"]*)".*/\1/')
          cargo_ver=$(awk -F'"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)
          tauri_ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' src-tauri/tauri.conf.json \
            | head -1 | sed -E 's/.*"([^"]*)"$/\1/')
          npm_ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' package.json \
            | head -1 | sed -E 's/.*"([^"]*)"$/\1/')
          # The root version, which is the first one in the file, after "name".
          # npm ci does not object to this being stale, so nothing else catches
          # it: the lock sat on 0.12.0 through the whole of 0.13.0.
          lock_ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' package-lock.json \
            | head -1 | sed -E 's/.*"([^"]*)"$/\1/')

          echo "metainfo (newest release): $meta_ver"
          echo "src-tauri/Cargo.toml:      $cargo_ver"
          echo "src-tauri/tauri.conf.json: $tauri_ver"
          echo "package.json:              $npm_ver"
          echo "package-lock.json:         $lock_ver"

          fail=0
          for v in "$cargo_ver" "$tauri_ver" "$npm_ver" "$lock_ver"; do
            if [ "$v" != "$meta_ver" ]; then
              echo "::error::Version mismatch between metainfo, Cargo.toml, tauri.conf.json, package.json and package-lock.json"
              fail=1
              break
            fi
          done

          # workflow_dispatch has no tag, so only the internal check applies.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            echo "git tag:                   $tag_ver"
            if [ "$tag_ver" != "$meta_ver" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $meta_ver. A release needs a <release> entry in $META, not just a tag."
              fail=1
            fi
          fi

          [ "$fail" -eq 0 ] && echo "versions agree"
          echo "version=$meta_ver" >> "$GITHUB_OUTPUT"
          exit $fail


  # Every build runs from its own workflow, so the graph reads the same on
  # each side and a pull request can build the Windows one without reaching
  # anything in here that publishes.
  windows:
    name: Windows installer
    needs: [check, versions]
    uses: ./.github/workflows/windows-installer.yml
    permissions:
      contents: read

  linux:
    name: Linux packages
    needs: [check, versions]
    uses: ./.github/workflows/linux-packages.yml
    permissions:
      contents: read

  flatpak:
    name: Flatpak build
    needs: [check, versions]
    uses: ./.github/workflows/flatpak-bundle.yml
    permissions:
      contents: read

  # Lands the Linux builds in the three repositories bifrossh.aalman.dev
  # serves, signed, without uploading anything. The site it builds goes to
  # publish-r2, and the files the release carries come from here rather than
  # from the builds: the signed .rpm, and the .flatpak bundled from the
  # signed store, so the download and what the repository serves are the
  # same bytes.
  #
  # Holds the signing key and no bucket credential; publish-r2 holds the
  # reverse. Reading what is already published needs neither, since it goes
  # through the public URL.
  stage:
    name: Stage the Linux repositories
    needs: [versions, linux, flatpak]
    runs-on: ubuntu-24.04
    steps:
      # For the scripts, not the source.
      - uses: actions/checkout@v7

      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak ostree apt-utils createrepo-c rpm

      - uses: actions/download-artifact@v8
        with:
          name: bifrossh-ostree-repo

      - uses: actions/download-artifact@v8
        with:
          name: bifrossh-linux-packages
          path: packages

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
        run: .github/scripts/repo/import-key.sh

      - name: Stage Flatpak, apt and dnf
        env:
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          RETENTION: ${{ vars.RETENTION }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir built
          tar -xf ostree-repo.tar -C built
          deb=(packages/*.deb) rpm=(packages/*.rpm)
          [ "${#deb[@]}" -eq 1 ] && [ "${#rpm[@]}" -eq 1 ] \
            || { echo "::error::expected one .deb and one .rpm, got: $(ls packages)"; exit 1; }
          s=.github/scripts/repo
          "$s/stage-flatpak.sh" built site "$VERSION" release
          "$s/stage-apt.sh" "${deb[0]}" site release
          "$s/stage-rpm.sh" "${rpm[0]}" site release
          "$s/descriptors.sh" site "$VERSION"
          tar -cf site.tar -C site .
          ls -lh site.tar release

      - uses: actions/upload-artifact@v7
        with:
          name: bifrossh-site
          path: site.tar
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: bifrossh-linux-release
          path: release/
          if-no-files-found: error

  # One release carrying every artefact, rather than each build attaching its
  # own. A release holding half of what it should is worse than one that fails
  # outright, because nobody notices the missing half.
  #
  # A plain runner: this wants the files and the write permission, not the
  # privileged container that produced one of them.
  publish-release:
    name: Publish release
    needs: [stage, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The .flatpak, the signed .rpm and the .deb, as the repositories serve
      # them.
      - uses: actions/download-artifact@v8
        with:
          name: bifrossh-linux-release
          path: artefacts

      - uses: actions/download-artifact@v8
        with:
          name: bifrossh-windows-installer
          path: artefacts

      - run: ls -lh artefacts

      # The Windows installer is unsigned, so SmartScreen warns on first run
      # until the download builds reputation. Said in the README rather than
      # left as a surprise.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artefacts/bifrossh.flatpak
            artefacts/*-setup.exe
            artefacts/*.deb
            artefacts/*.rpm
          # A pattern matching nothing is a release missing an artefact, which
          # is what happened to 0.13.1: the .deb and .rpm were built and
          # uploaded, the glob did not match where they landed, and this step
          # published four files short and called it a success.
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Last, because publishing the repositories is what hands the update to
  # everyone already installed. Doing it before the release exists would leave
  # them offering a version with nothing behind it.
  #
  # always() with an explicit result check rather than a bare needs: a
  # workflow_dispatch run has no tag, so publish-release is skipped, and this
  # still has to run or the manual re-publish path disappears. A skipped
  # release is fine here; a failed one is not.
  publish-r2:
    name: Publish to R2
    needs: [versions, stage, publish-release]
    if: |
      always()
      && needs.stage.result == 'success'
      && needs.publish-release.result != 'failure'
      && needs.publish-release.result != 'cancelled'
    uses: ./.github/workflows/publish-r2.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.versions.outputs.version }}
    secrets: inherit
