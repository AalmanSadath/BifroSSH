name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only one publish at a time: the ostree repo on the Pages branch is mutable
# shared state, and concurrent writers would corrupt it.
concurrency:
  group: flatpak-repo
  cancel-in-progress: false

# Only the two publish jobs write anything. The builds, and the CI run they
# depend on, get read and nothing more.
permissions:
  contents: read

env:
  APP_ID: io.github.aalmansadath.bifrossh

jobs:
  # The builds below run in a sandbox and never run the test suite, so without
  # this a tag could ship code that CI would have failed. Same checks as an
  # ordinary push, reached from here so that publishing depends on them.
  check:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Its own job because two builds depend on it, and because it costs seconds:
  # a mistake here should not be discovered twenty minutes into a sandboxed
  # Flatpak build or an NSIS package.
  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions agree
        # Runs before the expensive steps so a mistake costs seconds, not a full
        # build. AppStream takes the version from the metainfo, not the git tag,
        # so tagging without adding a <release> entry ships an app that updates
        # correctly and then reports the wrong version: a quiet failure that is
        # easy to make and annoying to diagnose.
        run: |
          META="flatpak/${APP_ID}.metainfo.xml"

          # AppStream orders <releases> newest first and every entry here shares
          # the same date, so document order is the only usable signal. Taking
          # the first entry matches how the file is written and maintained.
          meta_ver=$(grep -o '<release version="[^"]*"' "$META" \
            | head -1 | sed -E 's/.*version="([^"]*)".*/\1/')
          cargo_ver=$(awk -F'"' '/^\[package\]/{p=1} p && /^version[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)
          tauri_ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' src-tauri/tauri.conf.json \
            | head -1 | sed -E 's/.*"([^"]*)"$/\1/')
          npm_ver=$(grep -o '"version"[[:space:]]*:[[:space:]]*"[^"]*"' package.json \
            | head -1 | sed -E 's/.*"([^"]*)"$/\1/')

          echo "metainfo (newest release): $meta_ver"
          echo "src-tauri/Cargo.toml:      $cargo_ver"
          echo "src-tauri/tauri.conf.json: $tauri_ver"
          echo "package.json:              $npm_ver"

          fail=0
          for v in "$cargo_ver" "$tauri_ver" "$npm_ver"; do
            if [ "$v" != "$meta_ver" ]; then
              echo "::error::Version mismatch between metainfo, Cargo.toml, tauri.conf.json and package.json"
              fail=1
              break
            fi
          done

          # workflow_dispatch has no tag, so only the internal check applies.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_ver="${GITHUB_REF_NAME#v}"
            echo "git tag:                   $tag_ver"
            if [ "$tag_ver" != "$meta_ver" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $meta_ver. A release needs a <release> entry in $META, not just a tag."
              fail=1
            fi
          fi

          [ "$fail" -eq 0 ] && echo "versions agree"
          exit $fail


  # Both builds run from their own workflow, so the graph reads the same on
  # each side and a pull request can build the Windows one without reaching
  # anything in here that publishes.
  windows:
    name: Windows installer
    needs: [check, versions]
    uses: ./.github/workflows/windows-installer.yml
    permissions:
      contents: read

  flatpak:
    name: Flatpak bundle
    needs: [check, versions]
    uses: ./.github/workflows/flatpak-bundle.yml
    permissions:
      contents: read
    secrets:
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

  # One release carrying both artefacts, rather than each build attaching its
  # own. A release holding half of what it should is worse than one that fails
  # outright, because nobody notices the missing half.
  #
  # A plain runner: this wants the two files and the write permission, not the
  # privileged container that produced them.
  publish-release:
    name: Publish release
    needs: [flatpak, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bifrossh-flatpak-bundle
          path: artefacts

      - uses: actions/download-artifact@v4
        with:
          name: bifrossh-windows-installer
          path: artefacts

      - run: ls -lh artefacts

      # The Windows installer is unsigned, so SmartScreen warns on first run
      # until the download builds reputation. Said in the README rather than
      # left as a surprise.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefacts/bifrossh.flatpak
            artefacts/*-setup.exe
          generate_release_notes: true

  # Last, because publishing here is what hands the update to everyone already
  # installed. Doing it before the release exists would leave the repo offering
  # a version with nothing behind it.
  #
  # always() with an explicit result check rather than a bare needs: a
  # workflow_dispatch run has no tag, so publish-release is skipped, and this
  # still has to run or the manual re-publish path disappears. A skipped
  # release is fine here; a failed one is not.
  publish-pages:
    name: Publish GitHub Pages
    needs: [flatpak, publish-release]
    if: |
      always()
      && needs.flatpak.result == 'success'
      && needs.publish-release.result != 'failure'
      && needs.publish-release.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bifrossh-ostree-repo

      - name: Unpack the ostree repo
        run: |
          mkdir -p pages
          tar -xf ostree-repo.tar -C pages
          # A partial or wrong tree here would be published over the live repo
          # and break updates for everyone installed, so it is checked before
          # anything is pushed rather than after.
          test -f pages/config || {
            echo "::error::the unpacked repo has no ostree config"; exit 1; }
          rm -rf pages/.git
          ls -la pages | head

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          publish_branch: gh-pages
          # Deliberately NOT keep_files. The existing repo was cloned into
          # pages/ at the start of the build, so nothing is lost, and mirroring
          # the directory exactly is what lets --prune actually remove objects
          # instead of leaving them in git history forever.
          force_orphan: false
          commit_message: "Publish ${{ github.ref_name }}"
