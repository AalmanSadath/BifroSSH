name: Windows installer

# Three doors into the same build.
#
# `pull_request` is the one that matters day to day: it produces an installer
# anyone can download and run, which is the only way to find out that a change
# starts on Windows. Nothing here publishes, so a pull request reaching it is
# safe in a way that reaching the Flatpak publish would not be.
#
# `workflow_call` is how the release workflow builds the same thing, so the
# steps exist once.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

# Nothing here writes to the repository, a release or a package; the token
# only has to read the checkout. A caller can grant no more than it asks for.
permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned by commit, the action can no longer read the toolchain
          # from its ref, so it is named here.
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # NSIS only. The MSI that `targets: "all"` would also build needs WiX and
      # installs per machine, which means an admin prompt for an app that keeps
      # everything it owns under the user's profile anyway.
      - name: Build the installer
        run: npm run tauri -- build --bundles nsis

      - name: Find the installer
        id: artefact
        shell: bash
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          if [ -z "$exe" ]; then
            echo "::error::tauri build produced no NSIS installer"
            exit 1
          fi
          echo "path=$exe" >> "$GITHUB_OUTPUT"
          ls -lh "$exe"

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bifrossh-windows-installer
          path: ${{ steps.artefact.outputs.path }}
          if-no-files-found: error
