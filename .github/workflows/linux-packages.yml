name: Linux packages

# Two doors, not the three the Windows installer has.
#
# `pull_request` is deliberately absent. Windows builds on every pull request
# because there is no other way to find out that a change starts on Windows;
# Linux is the machine this is developed on, so `npm run tauri -- build` says
# the same thing twenty minutes sooner and without a runner.
#
# `workflow_call` is how the release workflow builds these, so the steps exist
# once, and `workflow_dispatch` is how they get built on demand.
on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The same list the backend job in ci.yml installs, and it has to stay
      # that way: a package missing here is a release that cannot be built
      # from a tree CI just called green.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            file

      - run: npm ci

      # Named bundles for the same reason the Windows job names nsis. The
      # `targets: "all"` in tauri.conf.json would also build an AppImage, which
      # downloads its runtime mid-build and is a third artefact nobody asked
      # for.
      #
      # Built on ubuntu-latest, so these carry its glibc floor. Anything older
      # wants the Flatpak, which is what the README tells people.
      - name: Build the packages
        run: npm run tauri -- build --bundles deb,rpm

      - name: Find the packages
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1)
          # Checked one at a time rather than leaning on if-no-files-found,
          # which would say only that something was missing.
          if [ -z "$deb" ]; then
            echo "::error::tauri build produced no .deb"
            exit 1
          fi
          if [ -z "$rpm" ]; then
            echo "::error::tauri build produced no .rpm"
            exit 1
          fi
          # Gathered into one directory before upload. Given two paths,
          # upload-artifact keeps the tree below their common ancestor, which
          # here is bundle/, so the artefact came out holding deb/ and rpm/
          # subdirectories. The release job globs the download root, matched
          # nothing, and published without them.
          mkdir -p packages
          cp "$deb" "$rpm" packages/
          ls -lh packages

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: bifrossh-linux-packages
          path: packages/
          if-no-files-found: error
