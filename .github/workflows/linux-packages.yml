name: Linux packages

# Two doors, not the three the Windows installer has.
#
# `pull_request` is deliberately absent. Windows builds on every pull request
# because there is no other way to find out that a change starts on Windows;
# Linux is the machine this is developed on, so `npm run tauri -- build` says
# the same thing twenty minutes sooner and without a runner.
#
# `workflow_call` is how the release workflow builds these, so the steps exist
# once, and `workflow_dispatch` is how they get built on demand.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # Set by nightly.yml, and only there; empty builds what the tree says.
      # `version` is the semver one the app reports. Neither package format
      # can carry it as it is, since in both a nightly must sort below the
      # release it leads to, so each gets its own:
      #   deb_version  0.18.2~nightly.20261118 (~ sorts first in dpkg)
      #   rpm_release  0.nightly20261118, under Version 0.18.2. Tauri's rpm
      #                step refuses the '-' of a pre-release and its config
      #                refuses a '~', so this is Fedora's own convention
      #                for a pre-release: a Release starting 0 sorts below
      #                the 1 every release carries.
      version:
        type: string
        default: ''
      date:
        type: string
        default: ''
      deb_version:
        type: string
        default: ''
      rpm_release:
        type: string
        default: ''

# Nothing here writes to the repository, a release or a package; the token
# only has to read the checkout. A caller can grant no more than it asks for.
permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set the nightly version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          DATE: ${{ inputs.date }}
        run: .github/scripts/set-version.sh "$VERSION" "$DATE"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned by commit, the action can no longer read the toolchain
          # from its ref, so it is named here.
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      # The same list the backend job in ci.yml installs, and it has to stay
      # that way: a package missing here is a release that cannot be built
      # from a tree CI just called green.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            build-essential \
            file

      - run: npm ci

      # Named bundles for the same reason the Windows job names nsis. The
      # `targets: "all"` in tauri.conf.json would also build an AppImage, which
      # downloads its runtime mid-build and is a third artefact nobody asked
      # for.
      #
      # Built on Ubuntu 24.04, so these carry its glibc floor (2.39). Anything
      # older wants the Flatpak, which is what the README tells people. The
      # runner is pinned rather than ubuntu-latest so that floor only moves
      # when it is chosen to.
      - name: Build the packages
        if: inputs.version == ''
        run: npm run tauri -- build --bundles deb,rpm

      # The binary is built once, reporting the nightly version; only the rpm's
      # own label is bundled again, as 0.18.2 with the nightly's Release.
      - name: Build the nightly packages
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          RPM_RELEASE: ${{ inputs.rpm_release }}
        run: |
          set -euo pipefail
          npm run tauri -- build --bundles deb
          core="${VERSION%%-*}"
          npm run tauri -- bundle --bundles rpm --config \
            "{\"version\":\"$core\",\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"$RPM_RELEASE\"}}}}"

      - name: Find the packages
        run: |
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
          rpm=$(ls src-tauri/target/release/bundle/rpm/*.rpm 2>/dev/null | head -1)
          # Checked one at a time rather than leaning on if-no-files-found,
          # which would say only that something was missing.
          if [ -z "$deb" ]; then
            echo "::error::tauri build produced no .deb"
            exit 1
          fi
          if [ -z "$rpm" ]; then
            echo "::error::tauri build produced no .rpm"
            exit 1
          fi
          # Gathered into one directory before upload. Given two paths,
          # upload-artifact keeps the tree below their common ancestor, which
          # here is bundle/, so the artefact came out holding deb/ and rpm/
          # subdirectories. The release job globs the download root, matched
          # nothing, and published without them.
          mkdir -p packages
          cp "$deb" "$rpm" packages/
          ls -lh packages

      # Tauri writes the semver version into the deb, and in dpkg's eyes
      # 0.18.2-nightly.20261118 is 0.18.2 at Debian revision "nightly...",
      # above the release. Unpacked, given the ~ form, packed again. The
      # files are named after the semver version, since GitHub rewrites some
      # characters in asset names.
      - name: Label the nightly packages
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          DEB_VERSION: ${{ inputs.deb_version }}
        run: |
          set -euo pipefail
          deb=(packages/*.deb) rpm=(packages/*.rpm)
          work=$(mktemp -d)
          dpkg-deb -R "${deb[0]}" "$work/pkg"
          sed -i "s/^Version: .*/Version: $DEB_VERSION/" "$work/pkg/DEBIAN/control"
          rm "${deb[0]}"
          dpkg-deb --root-owner-group -b "$work/pkg" "packages/bifrossh_${VERSION}_amd64.deb"
          mv "${rpm[0]}" "packages/bifrossh-${VERSION}.x86_64.rpm"

          got=$(dpkg-deb -f "packages/bifrossh_${VERSION}_amd64.deb" Version)
          echo "deb Version: $got"
          [ "$got" = "$DEB_VERSION" ] || { echo "::error::deb carries $got, not $DEB_VERSION"; exit 1; }
          dpkg --compare-versions "$DEB_VERSION" lt "${VERSION%%-*}" \
            || { echo "::error::$DEB_VERSION does not sort below ${VERSION%%-*}"; exit 1; }
          ls -lh packages

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bifrossh-linux-packages
          path: packages/
          if-no-files-found: error
